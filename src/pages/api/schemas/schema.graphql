type User {
  id: ID!
  email: String!
}

type Document {
  id: ID!
  name: String!
  initial_ui: Int!
  initial_mgdl: Int!
  limit_ui: Int
  increment_mgdl: Int
  triggers_mgdl: [Int]
}

type UserDocuments {
  documents: [Document]
  documentsCount: Int
}

input DocumentInput {
  id: ID
  name: String
  initial_ui: Int
  initial_mgdl: Int
  limit_ui: Int
  increment_mgdl: Int
  triggers_mgdl: [Int]
}

type Query {
  getUser: User!
  getUserDocuments: UserDocuments
}

type Mutation {
  setUser: User!
  saveUserDocument(document: DocumentInput!): Document
  deleteUserDocument(id: ID!): Boolean
}